<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frostbite 2026 — Equipment Schedule</title>
<style>
 :root{--green:#13513a;--green2:#0e3f2d;--sky:#8ec6e6;--ink:#1a1a1a;--muted:#6b7280;--line:#e6e8ea;--card:#fff;--bg:#f4f6f7;--chip:#eef1f2}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0}
 body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:40px}
 header{background:var(--green);color:#fff;text-align:center;padding:12px 14px 10px;border-bottom:4px solid var(--sky)}
 .logocard{background:#fff;border-radius:14px;display:inline-block;padding:9px 16px;box-shadow:0 3px 11px rgba(0,0,0,.22)}
 .logocard img{height:100px;width:auto;display:block;margin:0 auto}
 .sub{font-size:12px;letter-spacing:.13em;text-transform:uppercase;opacity:.9;margin-top:7px}
 .updated{font-size:10.5px;color:#bfe0cf;opacity:.85;margin-top:3px}
 .reg{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:9px}
 .reg-tag{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#0c2b1f;padding:4px 10px;border-radius:999px;white-space:nowrap}
 .reg-fb .reg-tag{background:#8ec6e6} .reg-hotl .reg-tag{background:#f7941d}
 .reg-links{display:inline-flex;gap:7px;flex-wrap:wrap;justify-content:center}
 .reg a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;background:rgba(255,255,255,.10);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1.5px solid}
 .reg-fb a{border-color:#8ec6e6} .reg-hotl a{border-color:#f7941d}
 .reg-fb a:active{background:#8ec6e6;color:#0c2b1f} .reg-hotl a:active{background:#f7941d;color:#0c2b1f}
 .toggle{display:flex;justify-content:center;background:var(--green2);padding:10px}
 .toggle button{border:0;cursor:pointer;font-size:14px;font-weight:700;padding:9px 18px;background:#0b3324;color:#cfe6da}
 .toggle button:first-child{border-radius:999px 0 0 999px} .toggle button:last-child{border-radius:0 999px 999px 0}
 .toggle button[aria-pressed="true"]{background:var(--sky);color:#0c3324}
 .filterbar{position:sticky;top:0;z-index:10;background:var(--green2);padding:0 10px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
 .filterbar::-webkit-scrollbar{display:none}
 .chip{flex:0 0 auto;border:0;cursor:pointer;white-space:nowrap;background:var(--chip);color:#15412f;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px}
 .chip[aria-pressed="true"]{background:var(--sky);color:#0c3324}
 .count{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 2px}
 .list{padding:6px 12px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.04);border-left:4px solid var(--green)}
 .card.other{border-left:4px solid #d3d7da;background:#fbfcfc;padding:9px 14px;margin:7px 0}
 .evno{flex:0 0 auto;min-width:52px;text-align:center}
 .evno .n{display:inline-block;background:var(--green);color:#fff;font-weight:700;font-size:14px;border-radius:9px;padding:4px 8px;min-width:34px}
 .card.other .evno .n{background:#b9c0c4}
 .evno .t{display:block;font-weight:700;font-size:13px;margin-top:6px} .evno .t.tbd{color:#b7bcc0}
 .evno .bow{display:block;font-size:11px;font-weight:700;color:#15412f;background:#e7f1ea;border-radius:6px;margin-top:5px;padding:2px 0}
 .main{flex:1 1 auto;min-width:0}
 .name{font-size:16px;font-weight:700;line-height:1.2} .card.other .name{font-size:14px;font-weight:600;color:#8a9199;font-style:italic}
 .name .en{color:var(--sky)}
 .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#15412f;background:#e7f1ea;border:1px solid #cfe3d7;border-radius:6px;padding:2px 7px;margin-top:6px}
 .equip{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
 .equip div{font-size:13px} .equip .lab{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.07em;display:block}
 .equip .val{font-weight:600} .equip .val.empty{color:#c3c8cc}
 .lu-btn{margin-top:10px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer}
 .lu-btn[aria-expanded="true"]{background:var(--green);color:#fff}
 .lu-panel{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
 .lu-panel[hidden]{display:none}
 .seat{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dashed #eef1f2}
 .seat .s{color:var(--muted);font-weight:700;min-width:54px} .seat .nm{font-weight:600;text-align:right}
 .seat.cox .s{color:var(--green)}
 footer{text-align:center;color:var(--muted);font-size:11.5px;padding:18px}
</style></head><body>

const LABELS={masters:"Masters",expgirls:"Exp Girls",expboys:"Exp Boys",novgirls:"Novice Girls",novboys:"Novice Boys",mixed:"Mixed / Open"};
let mode="full",filter="all";
const list=document.getElementById("list"),count=document.getElementById("count");
function val(v){return v?`<span class="val">${v}</span>`:`<span class="val empty">—</span>`;}
function lineupHTML(lu){
  const rows=lu.map(s=>`<div class="seat${s[0]==="Cox"?" cox":""}"><span class="s">${s[0]}</span><span class="nm">${s[1]}</span></div>`).join("");
  return `<div class="lu-panel" hidden>${rows}</div>`;
}
function render(){
 let rows=DATA.slice();
 if(mode==="glc") rows=rows.filter(r=>r.glc);
 if(filter!=="all") rows=rows.filter(r=>r.cat===filter);
 const glcN=rows.filter(r=>r.glc).length, evN=new Set(rows.map(r=>r.num)).size;
 count.textContent=(filter==="all"&&mode==="full")?evN+" events · "+glcN+" GLC boats":glcN+(glcN===1?" race":" races");
 if(!rows.length){list.innerHTML='<div style="text-align:center;color:#6b7280;padding:28px">No races here.</div>';return;}
 list.innerHTML=rows.map(r=>{
   const time=r.time?`<span class="t">${r.time}</span>`:`<span class="t tbd">TBD</span>`;
   if(!r.glc) return `<div class="card other"><div class="evno"><span class="n">${r.num}</span>${time}</div><div class="main"><div class="name">${r.name}</div></div></div>`;
   const en=r.entry?` <span class="en">(${r.entry})</span>`:"";
   const bow=r.bow!==""?`<span class="bow">Bow ${r.bow}</span>`:"";
   const orb=`<div><span class="lab">Cox Orb</span>${val(r.orb)}</div>`;
   const sc=`<div><span class="lab">SpeedCoach</span>${val(r.sc)}</div>`;
   const lubtn=r.lu?`<button class="lu-btn" aria-expanded="false">Lineup ▾</button>`:"";
   const lupanel=r.lu?lineupHTML(r.lu):"";
   return `<div class="card"><div class="evno"><span class="n">${r.num}</span>${time}${bow}</div>
     <div class="main"><div class="name">${r.name}${en}</div><span class="tag">${LABELS[r.cat]||""}</span>
       <div class="equip"><div><span class="lab">Boat</span>${val(r.boat)}</div><div><span class="lab">Oars</span>${val(r.oars)}</div>${orb}${sc}</div>
       ${lubtn}${lupanel}
     </div></div>`;
 }).join("");
}
document.getElementById("mode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;document.querySelectorAll("#mode button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#filters .chip").forEach(c=>c.setAttribute("aria-pressed",c===b));window.scrollTo({top:0,behavior:"instant"});render();});
list.addEventListener("click",e=>{const b=e.target.closest(".lu-btn");if(!b)return;const p=b.nextElementSibling;const open=p.hasAttribute("hidden");if(open){p.removeAttribute("hidden");b.setAttribute("aria-expanded","true");b.textContent="Lineup ▴";}else{p.setAttribute("hidden","");b.setAttribute("aria-expanded","false");b.textContent="Lineup ▾";}});
render();
